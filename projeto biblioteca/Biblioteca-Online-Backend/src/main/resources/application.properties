spring.application.name=Biblioteca-Online

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

google.books.api.base-url=${GOOGLE_BOOKS_API_BASE_URL:https://www.googleapis.com}
google.books.api.key=${GOOGLE_BOOKS_API_KEY:}

spring.data.web.pageable.max-page-size=40

app.security.jwt.secret=${JWT_SECRET:dev-local-secret-key-with-at-least-32-chars}
app.security.jwt.issuer=${JWT_ISSUER:biblioteca-online}
app.security.jwt.expires-in-minutes=${JWT_EXPIRES_IN_MINUTES:60}
